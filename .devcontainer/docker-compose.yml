#ssh -T github-alexfaria # ssh -T gitlab-alexfaria
services:
  prj-gestao-integrada:
    image: prj-gestao-integrada:cli
    container_name: prj-gestao-integrada
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      "args": { "USERNAME": "ubuntu", "ENABLE_SWITCH_USER", "true" }    
    secrets:
      - env      
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN não definido no .env}
      REDIS_HOST: ${REDIS_HOST:-redis-cache}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      XAUTHORITY: /tmp/.xauth-devc
      DOTNET_GCHeapHardLimitPercent: "50"
      UV_THREADPOOL_SIZE: "6"    
    volumes:
      - ../:/workspace:cached
      - vscode-extensions-shared-dotnet:/home/ubuntu/.vscode-server/extensions:cached
      - dotnet-node-modules:/workspace/frontend/node_modules:cached 
      - shell_history-shared-dotnet:/home/ubuntu/shell_history:cached 
      - vsc-nuget-packages:/home/ubuntu/.nuget/packages:cached
      - vsc-aspire-home:/home/ubuntu/.aspire:cached
      - vsc-apphost-bin:/workspace/AppHost/bin:cached
      - vsc-apphost-obj:/workspace/AppHost/obj:cached
      - vsc-appserver-bin:/workspace/AppServer/bin:cached
      - vsc-appserver-obj:/workspace/AppServer/obj:cached
      - vsc-frontend-bin:/workspace/frontend/bin:cached
      - vsc-frontend-obj:/workspace/frontend/obj:cached
      - vsc-frontend-angular:/workspace/frontend/.angular:cached
      - vsc-dataseeders-bin:/workspace/migrations/DataSeeders/bin:cached
      - vsc-dataseeders-obj:/workspace/migrations/DataSeeders/obj:cached
      - vsc-mssqlserver-bin:/workspace/migrations/MsSqlServer/bin:cached
      - vsc-mssqlserver-obj:/workspace/migrations/MsSqlServer/obj:cached
      - vsc-mysqlserver-bin:/workspace/migrations/MySqlServer/bin:cached
      - vsc-mysqlserver-obj:/workspace/migrations/MySqlServer/obj:cached
      - vsc-oracle-bin:/workspace/migrations/Oracle/bin:cached
      - vsc-oracle-obj:/workspace/migrations/Oracle/obj:cached
      - vsc-application-bin:/workspace/src/Application/bin:cached
      - vsc-application-obj:/workspace/src/Application/obj:cached
      - vsc-crosscutting-bin:/workspace/src/CrossCutting/bin:cached
      - vsc-crosscutting-obj:/workspace/src/CrossCutting/obj:cached
      - vsc-domain-bin:/workspace/src/Domain/bin:cached
      - vsc-domain-obj:/workspace/src/Domain/obj:cached
      - vsc-globalexception-bin:/workspace/src/GlobalException/bin:cached
      - vsc-globalexception-obj:/workspace/src/GlobalException/obj:cached
      - vsc-infrastructure-bin:/workspace/src/Infrastructure/bin:cached
      - vsc-infrastructure-obj:/workspace/src/Infrastructure/obj:cached
      - vsc-repository-bin:/workspace/src/Repository/bin:cached
      - vsc-repository-obj:/workspace/src/Repository/obj:cached
      - vsc-repository-mapping-bin:/workspace/src/Repository.Mapping/bin:cached
      - vsc-repository-mapping-obj:/workspace/src/Repository.Mapping/obj:cached
      - vsc-xunit-test-bin:/workspace/xUnit.Test/bin:cached
      - vsc-xunit-test-obj:/workspace/xUnit.Test/obj:cached
    tmpfs: 
      - /workspace/frontend/dist
    ports:
      - "17016:17015"
      - "7310:7309"
      - "5489:5488"
      - "15184:15183"
      - "46234:46233"
      - "41556:41555"
      - "35924:35923"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp:unconfined
    command: sleep infinity
    tty: true
    stdin_open: true
    networks:
      - dotnet-network
      - redis-network
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G
    memswap_limit: 8G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

secrets:
  env:
    file: .env
    
volumes:
  vscode-extensions-shared-dotnet:
    external: true
  dotnet-node-modules:
    external: true
  shell_history-shared-dotnet:
    external: true
  vsc-aspire-home:
