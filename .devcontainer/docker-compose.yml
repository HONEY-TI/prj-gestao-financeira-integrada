#ssh -T github-alexfaria # ssh -T gitlab-alexfaria
services:
  prj-gestao-integrada:
    image: prj-gestao-integrada:cli
    container_name: prj-gestao-integrada
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      "args": { "USERNAME": "ubuntu", "ENABLE_SWITCH_USER", "true" }    
    secrets:
      - env      
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN não definido no .env}
      REDIS_HOST: ${REDIS_HOST:-redis-cache}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      XAUTHORITY: /tmp/.xauth-devc
      DOTNET_GCHeapHardLimitPercent: "50"
      UV_THREADPOOL_SIZE: "6"    
    volumes:
      - ../:/workspace:delegated
      - vscode-extensions-shared-dotnet:/home/ubuntu/.vscode-server/extensions:cached
      - dotnet-node-modules:/workspace/frontend/node_modules:cached 
      - shell_history-shared:/home/ubuntu/shell_history:cached 
    ports:
      - "17016:17015"
      - "7310:7309"
      - "5489:5488"
      - "15184:15183"
      - "46234:46233"
      - "41556:41555"
      - "35924:35923"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp:unconfined
    command: sleep infinity
    tty: true
    stdin_open: true
    networks:
      - dotnet-network
      - redis-network
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G
    memswap_limit: 8G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

secrets:
  env:
    file: .env
    
volumes:
  vscode-extensions-shared-dotnet:
    external: true
  dotnet-node-modules:
    external: true
  shell_history-shared:
    external: true

networks:
  dotnet-network:
    external: true
  redis-network:
    external: true
