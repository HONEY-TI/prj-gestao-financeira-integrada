#ssh -T github-alexfaria # ssh -T gitlab-alexfaria
services:
  prj-gestao-integrada:
    container_name: prj-gestao-integrada
    image: prj-gestao-integrada:latest
    tty: true
    stdin_open: true    
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      "args": { "USERNAME": "ubuntu", "ENABLE_SWITCH_USER", "true" }
    secrets:
      - env      
#    env_file:
#      - .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN não definido no .env}
      XAUTHORITY: /tmp/.xauth-devc
    volumes:
      - ../:/workspace:cached
      - vscode-extensions-shared:/home/ubuntu/.vscode-server/extensions:cached
      - dotnet-node-modules:/workspace/frontend/node_modules:cached 
    ports:
      - 17015:17015
      - 7309:7309
      - 5488:5488      
      - 15183:15183
      - 46233:46233
      - 41555:41555
      - 35923:35923
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp:unconfined
    command: sleep infinity
    networks:
      - dotnet-network
      - redis-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'        

secrets:
  env:
    file: .env
    
volumes:
  vscode-extensions-shared:
    external: true
  dotnet-node-modules:
    external: true

networks:
  dotnet-network:
    external: true
  redis-network:
    external: true