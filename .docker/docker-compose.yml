services:
  frontend:
    container_name: gestao-frontend
    image: alexfariakof/gestao-frontend:latest
    build:
      context: ..
      dockerfile: .docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - dotnet-node-modules:/workspace/frontend/node_modules:rw 
    networks:
      - dotnet-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      
  api:
    container_name: gestao-backend
    image: alexfariakof/gestao-backend:latest
    build:
      context: ..
      dockerfile: .docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__cache: "${REDIS_HOST}:${REDIS_PORT},password=${REDIS_PASSWORD}"
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - dotnet-network
      - redis-network
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  redis-network:
    external: true
  dotnet-network:
    external: true

volumes:  
  dotnet-node-modules:
    external: true